# Local infrastructure only. Postgres lives on Supabase (cloud or `supabase start`).
# Do not add a Postgres service here — see README "Local development".
services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  redis-data:
